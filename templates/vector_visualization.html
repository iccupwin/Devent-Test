{% extends "base_apple.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col">
            <h2>Визуализация векторов</h2>
            <button id="refreshData" class="btn btn-primary">
                <i class="fas fa-sync-alt"></i> Обновить данные
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card position-relative">
                <div class="card-body">
                    <h5 class="card-title">Интерактивная таблица</h5>
                    <div id="table"></div>
                    <!-- Анимированный спиннер -->
                    <div id="tableSpinner" style="display:flex; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:10; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s;">
                        <div class="spinner-border text-primary" style="width:3rem; height:3rem;" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">График схожести</h5>
                    <div id="plot"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем Tabulator -->
<link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
<!-- Подключаем Plotly -->
<script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
<style>
#tableSpinner {
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.7);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
}
#tableSpinner.show {
    opacity: 1;
    pointer-events: all;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let tableData = {{ table_data|default:'{"data":[],"columns":[]}'|safe }};
    let plotData = {{ plot_data|default:'{}'|safe }};

    // Функция для обновления таблицы
    function updateTable(data) {
        const table = document.getElementById('table');
        const spinner = document.getElementById('tableSpinner');
        spinner.classList.remove('show');
        table.innerHTML = '';
        if (!data.data || !data.columns || data.data.length === 0) {
            table.innerHTML = '<div class="alert alert-warning">Нет данных для отображения</div>';
            return;
        }
        const columns = data.columns.map(col => {
            if (col === 'Вектор') {
                return {
                    title: 'Вектор <span title="Вектор — это числовое представление задачи, используемое для поиска похожих задач и анализа схожести. Подробнее: embedding/semantic search."><i class="fas fa-info-circle"></i></span>',
                    field: col,
                    formatter: function(cell) {
                        const value = cell.getValue();
                        if (value === null || value === undefined || value === 'NaN' || (Array.isArray(value) && value.length === 0)) {
                            return '<span class="text-muted">Нет данных</span>';
                        }
                        if (typeof value === 'string' && value.indexOf('NaN') !== -1) {
                            return '<span class="text-muted">Нет данных</span>';
                        }
                        if (Array.isArray(value)) {
                            return '[' + value.slice(0, 5).map(x => Number(x).toFixed(2)).join(', ') + (value.length > 5 ? ', ...' : '') + ']';
                        }
                        return value;
                    },
                    headerSort: false
                };
            }
            return { title: col, field: col };
        });
        new Tabulator("#table", {
            data: data.data,
            columns: columns,
            layout: "fitColumns",
            pagination: true,
            paginationSize: 10
        });
    }

    // Функция для обновления графика
    function updatePlot(data) {
        const spinner = document.getElementById('tableSpinner');
        spinner.classList.remove('show');
        Plotly.newPlot('plot', [data], {
            title: 'Распределение схожести',
            xaxis: { title: 'Схожесть' },
            yaxis: { title: 'Количество' }
        });
    }

    // Инициализация
    document.getElementById('tableSpinner').classList.remove('show');
    updateTable(tableData);
    updatePlot(plotData);

    // Обработчик кнопки обновления
    document.getElementById('refreshData').addEventListener('click', function() {
        const button = this;
        const table = document.getElementById('table');
        const spinner = document.getElementById('tableSpinner');
        
        // Показываем спиннер
        spinner.classList.add('show');
        button.disabled = true;
        
        // Отправляем запрос на обновление данных
        fetch('/vector-visualization/refresh/')
            .then(async response => {
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    spinner.classList.remove('show');
                    table.innerHTML = '<div class="alert alert-danger">Ошибка: сервер вернул не JSON:<br><pre style="white-space:pre-wrap;max-height:300px;overflow:auto;">' + text.replace(/</g,'&lt;') + '</pre></div>';
                    throw new Error('Сервер вернул не JSON');
                }
            })
            .then(data => {
                if (data.success) {
                    updateTable({
                        data: data.data,
                        columns: data.columns
                    });
                    // Формируем данные для гистограммы
                    const plotObj = {
                        x: data.data.map(row => row['Схожесть']),
                        type: 'histogram',
                        name: 'Распределение схожести'
                    };
                    updatePlot(plotObj);
                } else {
                    spinner.classList.remove('show');
                    table.innerHTML = '<div class="alert alert-danger">Ошибка: ' + data.error + '</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                spinner.classList.remove('show');
                if (!table.innerHTML.includes('alert-danger')) {
                    table.innerHTML = '<div class="alert alert-danger">Ошибка: ' + error + '</div>';
                }
            })
            .finally(() => {
                spinner.classList.remove('show');
                button.disabled = false;
            });
    });
});
</script>
{% endblock %}
